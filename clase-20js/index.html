<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .modal-container{
            width: 100vw;
            height: 100vh;
            background-color: gray;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }
        .modal{
            width: 600px;
            height: 400px;
            border-radius: 10px;
            padding: 10px;
            background-color: azure;
        }
        .modal-header{
            display: flex;
            justify-content: space-between;
        }
        .btn-close{
            background-color: transparent;
            border: none;
        }
        .hidden{
            display: none;
        }
    </style>
</head>
<body>
    <div class="modal-container hidden">
        <div class="modal" draggable="true">
            <div class="modal-header">
                <h2>Modal title</h2>
                <button class="btn-close">X</button>
            </div>
            
        </div>
    </div>
    <button id="btn-register">Registro</button>

    <form id="formulario">
        <div>
            <label for="nombre">Ingrese un nombre</label>
            <input type="text" 
            placeholder="Esceiba su nombre" 
            id="nombre" 
            name="nombre">
        </div>
        <input type="submit">
    </form>

    <script src="./script.js"></script>
</body>
</html>
